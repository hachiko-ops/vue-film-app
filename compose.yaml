services:
  frontend:
    image: node:22-alpine
    working_dir: /frontend
    volumes:
      - ./frontend:/frontend
      - /frontend/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /backend
    volumes:
      - ./backend:/backend
    ports:
      - "8000:8000"